<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SUNDERING — Roster</title>

    <link
        rel="stylesheet"
        href="css/roster.css"
    >

</head>


<body>

    <div class="background"></div>

    <div class="noise"></div>


    <!-- =====================================================
         NAVIGATION
    ===================================================== -->

    <nav>

        <div class="logo">
            <span>SUND</span>ERING
        </div>

        <div class="navLinks">

            <a
                href="#"
                class="active"
            >
                Roster
            </a>

            <a href="#">
                World
            </a>

            <a href="#">
                Lore
            </a>

            <a href="#">
                Roles
            </a>

        </div>

    </nav>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="heroHeader">

        <div class="orbit">

            <div class="orbitDot"></div>

        </div>

        <div class="eyebrow">
            Project Sundering Roster
        </div>

        <h1>
            Characters
        </h1>

        <p>
            Learn the roster of characters in this fantastical world.
            From royalty, Gods, creatures, or even simple people…
            you’re bound to find someone who peaks your interest.
        </p>

    </header>


    <!-- =====================================================
         ROSTER
    ===================================================== -->

    <section class="rosterSection">

        <div class="controls">


            <!-- SEARCH -->

            <div class="search">

                <input
                    type="text"
                    id="search"
                    placeholder="SEARCH THE ARCHIVE..."
                >

            </div>


            <!-- ROLE FILTERS -->

            <div class="filters">


                <!-- ALL -->

                <button
                    class="roleFilter allFilter active"
                    data-role="all"
                >
                    All
                </button>


                <!-- VANGUARD -->

                <div class="roleGroup">

                    <button
                        class="roleFilter"
                        data-role="Vanguard"
                    >

                        <span>
                            Vanguard
                        </span>

                        <span class="dropdownArrow">
                            ⌄
                        </span>

                    </button>


                    <div class="subFilters">

                        <button data-role="Guardian">
                            Guardian
                        </button>

                        <button data-role="Warden">
                            Warden
                        </button>

                        <button data-role="Bludgeon">
                            Bludgeon
                        </button>

                    </div>

                </div>


                <!-- STRIKER -->

                <div class="roleGroup">

                    <button
                        class="roleFilter"
                        data-role="Striker"
                    >

                        <span>
                            Striker
                        </span>

                        <span class="dropdownArrow">
                            ⌄
                        </span>

                    </button>


                    <div class="subFilters">
                        
                        <button data-role="Brawler">
                            Brawler
                        </button>

                        <button data-role="Marksman">
                            Marksman
                        </button>

                        <button data-role="Hunter">
                            Hunter
                        </button>

                        <button data-role="Ravager">
                            Ravager
                        </button>

                        <button data-role="Disruptor">
                            Disruptor
                        </button>

                    </div>

                </div>


                <!-- CATALYST -->

                <div class="roleGroup">

                    <button
                        class="roleFilter"
                        data-role="Catalyst"
                    >

                        <span>
                            Catalyst
                        </span>

                        <span class="dropdownArrow">
                            ⌄
                        </span>

                    </button>


                    <div class="subFilters">

                        <button data-role="Lifeline">
                            Lifeline
                        </button>

                        <button data-role="Playmaker">
                            Playmaker
                        </button>

                        <button data-role="Utility">
                            Utility
                        </button>

                        <button data-role="Controller">
                            Controller
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- ROSTER GRID -->

        <div
            class="roster"
            id="roster"
        ></div>

    </section>


    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer>
        SUNDERING — THE ARCHIVE
    </footer>


    <!-- =====================================================
         HERO MODAL
    ===================================================== -->

    <div
        class="modal"
        id="modal"
    >

        <button
            class="close"
            id="closeModal"
        >
            ×
        </button>


        <div class="modalContent">

            <div class="detailHeader">


                <div
                    class="detailArt"
                    id="detailArt"
                >
                    ?
                </div>


                <div>

                    <div
                        class="eyebrow"
                        id="detailRole"
                    ></div>


                    <h2
                        class="detailName"
                        id="detailName"
                    ></h2>


                    <div
                        class="detailTitle"
                        id="detailTitle"
                    ></div>


                    <p
                        class="detailDescription"
                        id="detailDescription"
                    ></p>


                    <div
                        class="tags"
                        id="detailTags"
                    ></div>

                </div>

            </div>


            <!-- ABILITIES -->

            <section class="abilities">

                <div class="sectionTitle">
                    Abilities
                </div>


                <div
                    class="abilityGrid"
                    id="abilityGrid"
                ></div>

            </section>

        </div>

    </div>


    <!-- =====================================================
         ABILITY PREVIEW MODAL
    ===================================================== -->

    <div
        class="previewModal"
        id="previewModal"
    >

        <div class="previewWindow">

            <div class="previewHeader">

                <span id="previewTitle">
                    Ability Preview
                </span>

                <button
                    class="previewClose"
                    id="previewClose"
                >
                    ×
                </button>

            </div>


            <div
                class="previewMedia"
                id="previewMedia"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script src="js/heroes.js"></script>

    <script src="js/roster.js"></script>

</body>

</html>
